[package]
name = "fission-core"
version = "0.11.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/fission-ui/fission"
description = "Core runtime, state, actions, effects, resources, input, and UI model for Fission"
categories = ["gui", "rendering"]
keywords = ["fission", "ui-framework", "runtime", "state-management", "cross-platform"]

[package.metadata.fission]
platforms = ["android", "ios", "linux", "macos", "windows", "web", "terminal", "static-site", "ssr"]

homepage = "https://fission.rs"
documentation = "https://fission.rs"
readme = "README.md"

[features]
default = []
interactive-canvas = []

[dependencies]
fission-ir = { path = "../fission-ir", version = "0.11.1" }
fission-layout = { path = "../fission-layout", version = "0.11.1" }
fission-semantics = { path = "../fission-semantics", version = "0.11.1" }
fission-theme = { path = "../fission-theme", version = "0.11.1" }
fission-i18n = { path = "../fission-i18n", version = "0.11.1" }
fission-text-engine = { path = "../fission-text-engine", version = "0.11.1" }
fission-macros = { path = "../../authoring/fission-macros", version = "0.11.1" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
anyhow = "1.0"
bytes = "1.7"
futures-core = "0.3"
downcast-rs = "1.2"
lazy_static = "1.4"
blake3 = "1.5"
unicode-segmentation = "1.10"
glam = "0.29"
fission-diagnostics = { path = "../../tools/fission-diagnostics", version = "0.11.1", default-features = false }

[dev-dependencies]
