[package]
name = "fission-3d"
version = "0.11.0"
edition = "2021"

license = "MIT"
repository = "https://github.com/fission-ui/fission"
homepage = "https://fission.rs"
documentation = "https://fission.rs"
description = "3D scene primitives and rendering data types for Fission applications"
categories = ["rendering", "graphics"]
keywords = ["fission", "3d", "gpu-accelerated", "rendering", "cross-platform"]

[package.metadata.fission]
platforms = ["android", "ios", "linux", "macos", "windows", "web"]
readme = "README.md"
[dependencies]
fission-core = { path = "../fission-core", version = "0.11.0" }
fission-ir = { path = "../fission-ir", version = "0.11.0" }
serde = { version = "1.0", features = ["derive"] }
wgpu = "26.0"
bytemuck = { version = "1.18", features = ["derive"] }
bincode = "1.3"
