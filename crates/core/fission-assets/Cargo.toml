[package]
name = "fission-assets"
version = "0.14.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/fission-ui/fission"
homepage = "https://fission.rs"
documentation = "https://fission.rs"
description = "Typed asset provenance and licence metadata for Fission build tooling"
categories = ["game-development", "development-tools"]
keywords = ["fission", "assets", "provenance", "licensing", "games"]

[package.metadata.fission]
platforms = ["android", "ios", "linux", "macos", "windows", "web"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
