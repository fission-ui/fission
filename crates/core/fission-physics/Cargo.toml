[package]
name = "fission-physics"
version = "0.1.0-alpha.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/fission-ui/fission"
homepage = "https://fission.rs"
documentation = "https://fission.rs"
description = "Backend-neutral physics contracts for Fission games and scenes"
readme = "README.md"
categories = ["game-development", "game-engines"]
keywords = ["fission", "physics", "2d", "3d"]

[package.metadata.fission]
platforms = ["android", "ios", "linux", "macos", "windows", "web"]
api-status = "alpha"

[dependencies]
fission-game = { path = "../fission-game", version = "=0.1.0-alpha.1" }
fission-scene = { path = "../fission-scene", version = "=0.1.0-alpha.1" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
