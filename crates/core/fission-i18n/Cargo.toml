[package]
name = "fission-i18n"
version = "0.13.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/fission-ui/fission"
description = "Internationalization primitives for Fission applications"
categories = ["gui", "localization"]
keywords = ["fission", "i18n", "localization", "translations", "ui-framework"]

[package.metadata.fission]
platforms = ["android", "ios", "linux", "macos", "windows", "web", "terminal", "static-site", "ssr"]

homepage = "https://fission.rs"
documentation = "https://fission.rs"
readme = "README.md"
[dependencies]
serde = { version = "1.0", features = ["derive"] }
