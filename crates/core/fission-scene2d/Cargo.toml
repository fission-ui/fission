[package]
name = "fission-scene2d"
version = "0.1.0-alpha.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/fission-ui/fission"
homepage = "https://fission.rs"
documentation = "https://fission.rs"
description = "Retained renderer-neutral 2D scenes for Fission"
readme = "README.md"
categories = ["game-development", "graphics"]
keywords = ["fission", "scene", "2d", "sprites", "canvas"]

[package.metadata.fission]
platforms = ["android", "ios", "linux", "macos", "windows", "web"]
api-status = "alpha"

[dependencies]
fission-core = { path = "../fission-core", version = "0.15.1" }
fission-ir = { path = "../fission-ir", version = "0.15.1" }
fission-scene = { path = "../fission-scene", version = "=0.1.0-alpha.1" }
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
