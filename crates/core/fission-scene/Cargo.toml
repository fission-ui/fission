[package]
name = "fission-scene"
version = "0.1.0-alpha.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/fission-ui/fission"
homepage = "https://fission.rs"
documentation = "https://fission.rs"
description = "Renderer-neutral scene identity, assets, math, and diagnostics for Fission"
categories = ["game-development", "graphics"]
keywords = ["fission", "scene", "2d", "3d", "assets"]

[package.metadata.fission]
platforms = ["android", "ios", "linux", "macos", "windows", "web"]
api-status = "alpha"

[dependencies]
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
