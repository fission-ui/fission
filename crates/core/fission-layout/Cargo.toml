[package]
name = "fission-layout"
version = "0.13.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/fission-ui/fission"
description = "Layout engine primitives for Fission widget trees"
categories = ["gui", "rendering"]
keywords = ["fission", "layout", "ui-framework", "widgets", "cross-platform"]

[package.metadata.fission]
platforms = ["android", "ios", "linux", "macos", "windows", "web", "terminal", "static-site", "ssr"]

homepage = "https://fission.rs"
documentation = "https://fission.rs"
readme = "README.md"
[dependencies]
fission-ir = { path = "../fission-ir", version = "0.13.0" }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
fission-diagnostics = { path = "../../tools/fission-diagnostics", version = "0.13.0", default-features = false }

[dev-dependencies]
