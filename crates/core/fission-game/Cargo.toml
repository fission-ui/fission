[package]
name = "fission-game"
version = "0.14.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/fission-ui/fission"
homepage = "https://fission.rs"
documentation = "https://fission.rs"
description = "Deterministic runtime primitives shared by Fission 2D and 3D games"
categories = ["game-development", "game-engines"]
keywords = ["fission", "game", "deterministic", "2d", "3d"]

[package.metadata.fission]
platforms = ["android", "ios", "linux", "macos", "windows", "web"]

[features]
default = []
physics-rapier2d = ["dep:rapier2d"]
physics-rapier3d = ["dep:rapier3d"]

[dependencies]
fission-ir = { path = "../fission-ir", version = "0.14.1" }
rapier2d = { version = "0.35.3", optional = true, default-features = false, features = ["dim2", "f32", "std", "block-solver", "enhanced-determinism"] }
rapier3d = { version = "0.35.3", optional = true, default-features = false, features = ["dim3", "f32", "std", "block-solver", "enhanced-determinism"] }
serde = { version = "1.0", features = ["derive", "rc"] }

[dev-dependencies]
serde_json = "1.0"
