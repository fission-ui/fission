[package]
name = "fission-theme"
version = "0.13.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/fission-ui/fission"
description = "Design tokens, Design System Package codegen output, and component themes for Fission"
categories = ["gui"]
keywords = ["fission", "design-system", "theming", "design-tokens", "ui-framework"]
include = [
    "src/**/*",
    "design/**/*",
    "build.rs",
    "README.md",
    "Cargo.toml",
    "fonts/Inter/static/Inter_24pt-Regular.ttf",
    "fonts/Inter/static/Inter_24pt-Medium.ttf",
    "fonts/Inter/static/Inter_24pt-SemiBold.ttf",
    "fonts/Inter/static/Inter_24pt-Bold.ttf",
    "fonts/Noto_Sans/static/NotoSans-Regular.ttf",
]

[package.metadata.fission]
platforms = ["android", "ios", "linux", "macos", "windows", "web", "terminal", "static-site", "ssr"]

homepage = "https://fission.rs"
documentation = "https://fission.rs"
readme = "README.md"
[dependencies]
fission-ir = { path = "../fission-ir", version = "0.13.0" }
serde = { version = "1.0", features = ["derive"] }

[build-dependencies]
fission-design-system-codegen = { path = "../../tools/fission-design-system-codegen", version = "0.13.0" }
