[package]
name = "fission-macros"
version = "0.11.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/fission-ui/fission"
description = "Procedural macros for Fission actions, reducers, and ergonomic app authoring"
categories = ["development-tools", "rust-patterns"]
keywords = ["fission", "macros", "reducers", "actions", "ui-framework"]

[package.metadata.fission]
platforms = ["android", "ios", "linux", "macos", "windows", "web", "terminal", "static-site", "ssr"]

homepage = "https://fission.rs"
documentation = "https://fission.rs"
readme = "README.md"
[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
proc-macro-crate = "3.4"

[dev-dependencies]
# For testing macros if needed, often done via `trybuild` or separate test crate
