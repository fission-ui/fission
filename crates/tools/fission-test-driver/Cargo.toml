[package]
name = "fission-test-driver"
version = "0.10.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/fission-ui/fission"
description = "Live app testing client and protocol helpers for Fission shells"
categories = ["development-tools::testing", "gui"]
keywords = ["fission", "testing", "test-driver", "ui-testing", "cross-platform"]

[package.metadata.fission]
platforms = ["linux", "macos", "windows"]

homepage = "https://fission.rs"
documentation = "https://fission.rs"
readme = "README.md"
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "2", features = ["json"] }
tungstenite = "0.24"
