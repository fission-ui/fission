[package]
name = "fission-command-package"
version = "0.13.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/fission-ui/fission"
description = "Packaging, readiness, static hosting, and distribution workflows for the fission command"
categories = ["command-line-utilities", "development-tools"]
keywords = ["fission", "packaging", "distribution", "release", "cross-platform"]

[package.metadata.fission]
platforms = ["linux", "macos", "windows"]

homepage = "https://fission.rs"
documentation = "https://fission.rs"
readme = "README.md"
[dependencies]
anyhow = "1.0"
aws-config = "1"
aws-sdk-s3 = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
fission-command-core = { path = "../fission-command-core", version = "0.13.0" }
fission-command-run = { path = "../fission-command-run", version = "0.13.0" }
fission-command-site = { path = "../fission-command-site", version = "0.13.0" }
flate2 = "1.0"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
rpassword = "7.3"
