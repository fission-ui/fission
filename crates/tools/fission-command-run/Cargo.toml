[package]
name = "fission-command-run"
version = "0.11.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/fission-ui/fission"
description = "Run, build, test, logs, devices, and doctor workflows for the fission command"
categories = ["command-line-utilities", "development-tools", "development-tools::testing"]
keywords = ["fission", "cli", "testing", "devices", "cross-platform"]

[package.metadata.fission]
platforms = ["linux", "macos", "windows"]

homepage = "https://fission.rs"
documentation = "https://fission.rs"
readme = "README.md"
[dependencies]
anyhow = "1.0"
fission-command-core = { path = "../fission-command-core", version = "0.11.0" }
fission-command-server = { path = "../fission-command-server", version = "0.11.0" }
fission-command-site = { path = "../fission-command-site", version = "0.11.0" }
fission-test-driver = { path = "../fission-test-driver", version = "0.11.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "2"
