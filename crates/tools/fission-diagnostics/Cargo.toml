[package]
name = "fission-diagnostics"
version = "0.14.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/fission-ui/fission"
description = "Structured diagnostics and reporting primitives for Fission tools and runtime checks"
categories = ["development-tools", "development-tools::debugging"]
keywords = ["fission", "diagnostics", "debugging", "tracing", "tooling"]

[package.metadata.fission]
platforms = ["linux", "macos", "web", "windows"]

homepage = "https://fission.rs"
documentation = "https://fission.rs"
readme = "README.md"
[lib]
path = "src/lib.rs"

[features]
default = ["web-console"]
# When disabled, emission macros become near no-ops at runtime (still compiled).
# We can later make this a true compile-time gate across the workspace.
fission_diagnostics = []
web-console = ["dep:wasm-bindgen", "dep:web-sys"]

[dependencies]
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
bitflags = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", features = ["console"], optional = true }
