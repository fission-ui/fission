[package]
name = "fission-command-core"
version = "0.10.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/fission-ui/fission"
description = "Shared project, manifest, target, and diagnostic model for the fission command"
categories = ["command-line-utilities", "development-tools"]
keywords = ["fission", "cli", "tooling", "cross-platform", "diagnostics"]

[package.metadata.fission]
platforms = ["linux", "macos", "windows"]

homepage = "https://fission.rs"
documentation = "https://fission.rs"
readme = "README.md"
[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
plist = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
toml = "0.8"
toml_edit = "0.23"
