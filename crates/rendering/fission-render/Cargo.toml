[package]
name = "fission-render"
version = "0.10.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/fission-ui/fission"
description = "Renderer trait and display-list conversion layer for Fission"
categories = ["rendering", "graphics", "gui"]
keywords = ["fission", "rendering", "display-list", "gpu-accelerated", "cross-platform"]
homepage = "https://fission.rs"
documentation = "https://fission.rs"
readme = "README.md"

[package.metadata.fission]
platforms = ["android", "ios", "linux", "macos", "windows", "web", "terminal", "static-site", "ssr"]
[dependencies]
fission-layout = { path = "../../core/fission-layout", version = "0.10.1" }
fission-ir = { path = "../../core/fission-ir", version = "0.10.1" }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
raw-window-handle = "0.6"
blake3 = "1.5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
moka = { version = "0.12.15", features = ["sync"] }

[dev-dependencies]
serde_json = "1.0"
