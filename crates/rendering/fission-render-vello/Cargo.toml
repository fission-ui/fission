[package]
name = "fission-render-vello"
version = "0.14.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/fission-ui/fission"
description = "Vello GPU and CPU renderer backends for Fission display lists"
categories = ["rendering", "graphics", "gui"]
keywords = ["fission", "vello", "gpu-accelerated", "rendering", "cross-platform"]

[package.metadata.fission]
platforms = ["android", "ios", "linux", "macos", "windows", "web"]

homepage = "https://fission.rs"
documentation = "https://fission.rs"
readme = "README.md"
[dependencies]
fission-render = { path = "../fission-render", version = "0.14.1" }
fission-layout = { path = "../../core/fission-layout", version = "0.14.1" }
fission-ir = { path = "../../core/fission-ir", version = "0.14.1" }
anyhow = "1.0"
vello_cpu = { package = "fission-vello-cpu", version = "0.2.0-fission.1", path = "../../../third_party/vello/vello_cpu" }
vello_gpu = { package = "fission-vello-gpu", version = "0.2.0-fission.1", path = "../../../third_party/vello/vello_gpu" }
wgpu = { version = "29.0.3", default-features = false, features = ["std", "wgsl"] }
parley = "0.11.1"
fission-diagnostics = { path = "../../tools/fission-diagnostics", version = "0.14.1" }
image = "0.24"
lazy_static = "1.5.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
uuid = { version = "1", features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-time = "1.1"
web-sys = { version = "0.3", features = ["Headers", "Request", "RequestInit", "RequestMode", "Response", "Window"] }
