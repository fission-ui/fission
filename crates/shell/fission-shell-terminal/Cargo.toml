[package]
name = "fission-shell-terminal"
version = "0.13.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/fission-ui/fission"
description = "Terminal shell backend for rendering Fission applications in terminal cells"
categories = ["command-line-interface", "gui", "rendering"]
keywords = ["fission", "terminal", "tui", "ui-framework", "cross-platform"]

[package.metadata.fission]
platforms = ["linux", "macos", "windows", "terminal"]

homepage = "https://fission.rs"
documentation = "https://fission.rs"
readme = "README.md"
[features]
default = []
store = ["fission-core/store", "dep:fission-store"]
store-sql = ["store", "fission-core/store-sql"]
store-sqlite-native = [
    "store-sql",
    "dep:fission-store-sqlite",
    "fission-store-sqlite/native",
]

[dependencies]
anyhow = "1.0"
ab_glyph = "0.2"
crossterm = "0.28"
image = { version = "0.25", default-features = false, features = ["png"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
fission-core = { path = "../../core/fission-core", version = "0.13.0" }
fission-ir = { path = "../../core/fission-ir", version = "0.13.0" }
fission-layout = { path = "../../core/fission-layout", version = "0.13.0" }
fission-store = { path = "../../core/fission-store", optional = true, version = "0.13.0" }
fission-store-sqlite = { path = "../../core/fission-store-sqlite", optional = true, version = "0.13.0", default-features = false }
fission-theme = { path = "../../core/fission-theme", version = "0.13.0" }
fission-test-driver = { path = "../../tools/fission-test-driver", version = "0.13.0" }
base64 = "0.22"
