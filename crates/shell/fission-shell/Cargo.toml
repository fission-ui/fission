[package]
name = "fission-shell"
version = "0.13.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/fission-ui/fission"
description = "Shared shell runtime contracts for hosting Fission applications"
categories = ["gui", "rendering"]
keywords = ["fission", "ui-framework", "cross-platform", "runtime", "shell"]

[package.metadata.fission]
platforms = ["android", "ios", "linux", "macos", "windows", "web", "terminal", "static-site", "ssr"]

homepage = "https://fission.rs"
documentation = "https://fission.rs"
readme = "README.md"
[features]
default = []
store = ["fission-core/store", "dep:fission-store"]
store-sql = ["store", "fission-core/store-sql"]
store-sqlite-native = [
    "store-sql",
    "dep:fission-store-sqlite",
    "fission-store-sqlite/native",
]
store-sqlite-web = [
    "store-sql",
    "dep:fission-store-sqlite",
    "fission-store-sqlite/web",
]
[dependencies]
fission-core = { path = "../../core/fission-core", version = "0.13.0" }
fission-ir = { path = "../../core/fission-ir", version = "0.13.0" }
fission-render = { path = "../../rendering/fission-render", version = "0.13.0" } # Corrected path
fission-store = { path = "../../core/fission-store", optional = true, version = "0.13.0" }
fission-store-sqlite = { path = "../../core/fission-store-sqlite", optional = true, version = "0.13.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
serde_json = "1.0"
raw-window-handle = "0.6"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[dev-dependencies]
