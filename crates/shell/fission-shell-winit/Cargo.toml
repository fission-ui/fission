[package]
name = "fission-shell-winit"
version = "0.13.0"
edition = "2021"
description = "Shared winit shell runtime for desktop and mobile Fission hosts"
categories = ["gui", "rendering"]
keywords = ["fission", "winit", "cross-platform", "desktop", "mobile"]
license = "Apache-2.0"
repository = "https://github.com/fission-ui/fission"
homepage = "https://fission.rs"
documentation = "https://fission.rs"
readme = "README.md"

[package.metadata.fission]
platforms = ["android", "ios", "linux", "macos", "windows", "web"]

[features]
default = []
tray = ["dep:tray-icon", "dep:gtk"]
three-d = ["dep:fission-3d"]
video = ["dep:gstreamer", "dep:gstreamer-video"]
store = ["fission-core/store", "fission-shell/store", "dep:fission-store"]
store-sql = ["store", "fission-core/store-sql", "fission-shell/store-sql"]
store-sqlite-native = [
    "store-sql",
    "dep:fission-store-sqlite",
    "fission-store-sqlite/native",
    "fission-shell/store-sqlite-native",
]
store-sqlite-web = [
    "store-sql",
    "dep:fission-store-sqlite",
    "fission-store-sqlite/web",
    "fission-shell/store-sqlite-web",
]

[dependencies]
fission-shell = { path = "../fission-shell", version = "0.13.0" }
fission-render = { path = "../../rendering/fission-render", version = "0.13.0" }
fission-render-vello = { path = "../../rendering/fission-render-vello", version = "0.13.0" }
fission-core = { path = "../../core/fission-core", version = "0.13.0" }
fission-layout = { path = "../../core/fission-layout", version = "0.13.0" }
fission-ir = { path = "../../core/fission-ir", version = "0.13.0" }
fission-semantics = { path = "../../core/fission-semantics", version = "0.13.0" }
fission-theme = { path = "../../core/fission-theme", version = "0.13.0" }
fission-3d = { path = "../../core/fission-3d", optional = true, version = "0.13.0" }
fission-store = { path = "../../core/fission-store", optional = true, version = "0.13.0" }
fission-store-sqlite = { path = "../../core/fission-store-sqlite", optional = true, version = "0.13.0", default-features = false }
winit = { package = "fission-winit", version = "0.30.13-fission.2" }
fission-diagnostics = { path = "../../tools/fission-diagnostics", version = "0.13.0" }
fission-test-driver = { path = "../../tools/fission-test-driver", version = "0.13.0" }
image = "0.25"
tiny-skia = "0.11.4"
fontdue = "0.9.3"
anyhow = "1.0"
raw-window-handle = "0.6"
bytemuck = "1.16"
serde_json = "1"
vello = { package = "fission-vello", path = "../../../third_party/vello/vello", version = "0.6.0-fission.2" }
pollster = "0.3"
fontique = "0.7"
read-fonts = "0.35"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
base64 = "0.22"
tray-icon = { version = "0.24", optional = true }
futures-core = "0.3"
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios", target_arch = "wasm32")))'.dependencies]
arboard = "3.4"
rfd = { version = "0.14.1", default-features = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
accesskit = "0.24.1"
accesskit_winit = { package = "fission-accesskit-winit", version = "0.33.1-fission.1" }

[target.'cfg(target_os = "android")'.dependencies]
accesskit = "0.24.1"
accesskit_winit = { package = "fission-accesskit-winit", version = "0.33.1-fission.1", default-features = false, features = ["accesskit_android", "rwh_06"] }
jni = "0.21"
ndk-context = "0.1"
winit = { package = "fission-winit", version = "0.30.13-fission.2", features = ["android-game-activity"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "UI_ViewManagement",
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = { version = "0.25", optional = true }
gstreamer-video = { version = "0.25", optional = true }
gtk = { version = "0.18", optional = true }

[target.'cfg(any(target_os = "android", target_os = "ios", target_os = "macos"))'.dependencies]
rxing = { version = "0.9", default-features = false, features = ["image", "image_formats", "decoders", "encoding_rs", "full_barcode_format_support", "multi_barcode_readers"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-time = "1.1"
tracing-wasm = "0.2.1"
web-sys = { version = "0.3", features = ["CanvasRenderingContext2d", "console", "CssStyleDeclaration", "Document", "DomRect", "Element", "Event", "EventTarget", "Headers", "History", "HtmlAnchorElement", "HtmlCanvasElement", "HtmlElement", "HtmlMediaElement", "HtmlVideoElement", "ImageData", "Location", "MouseEvent", "Node", "Request", "RequestInit", "RequestMode", "Response", "Window"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
cocoa = "0.25"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc = "0.2"
block = "0.1"
core-graphics = "0.23"

[target.'cfg(target_os = "ios")'.dependencies]
dispatch = "0.2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
fission-macros = { path = "../../authoring/fission-macros", version = "0.13.0" }
fission-widgets = { path = "../../authoring/fission-widgets", version = "0.13.0" }
lazy_static = "1"
