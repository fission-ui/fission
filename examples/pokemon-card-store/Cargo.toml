[package]
name = "pokemon-card-store"
version = "0.12.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
default = ["server"]
server = ["fission/server", "fission/site"]
browser = ["fission/site"]

[dependencies]
anyhow = "1.0"
fission = { path = "../../crates/authoring/fission", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "pokemon-card-store"
path = "src/main.rs"
required-features = ["server"]
