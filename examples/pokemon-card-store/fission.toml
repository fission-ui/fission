targets = [
    "linux",
    "macos",
    "ssr",
    "windows",
]

[app]
name = "pokemon-card-store"
app_id = "rs.fission.examples.pokemon_card_store"
version = "0.14.1"
build = 1

[server]
entry = "pokemon_card_store::pokemon_card_store_server"
default_route_mode = "server_private"
render_pass_limit = 4

[server.workers]
separate_artifacts = true
bridge = "generated"

[server.islands]
separate_artifacts = true
preload = "route"

[package.docker]
port = 8080
tags = ["ghcr.io/fission-ui/fission-pokemon-card-store:0.14.1"]

[package.macos]
bundle_id = "rs.fission.examples.pokemon_card_store"
marketing_version = "0.14.1"
build_number = "1"
minimum_os = "13.0"

[package.windows]
identity_name = "rs.fission.examples.pokemon.card.store"
publisher = "CN=Fission Developer"
version = "0.14.1"
installer = "msix"
certificate_thumbprint_env = "WINDOWS_CERTIFICATE_THUMBPRINT"
certificate_base64_env = "WINDOWS_CERTIFICATE_BASE64"
certificate_password_env = "WINDOWS_CERTIFICATE_PASSWORD"

[distribution.docker_registry.production]
tags = ["ghcr.io/fission-ui/fission-pokemon-card-store:0.14.1"]

[distribution.microsoft_store]
package_identity_name = "rs.fission.examples.pokemon.card.store"
package_type = "msix"
token_env = "MICROSOFT_STORE_TOKEN"
tenant_id_env = "AZURE_TENANT_ID"
client_id_env = "AZURE_CLIENT_ID"
client_secret_env = "MICROSOFT_STORE_CLIENT_SECRET"
seller_id_env = "MICROSOFT_STORE_SELLER_ID"
