[package]
name = "web-smoke"
version = "0.14.1"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "web_smoke"
crate-type = ["cdylib", "rlib"]

[features]
default = ["standalone-entry"]
standalone-entry = []

[dependencies]
anyhow = "1.0"
fission = { path = "../../crates/authoring/fission", default-features = false, features = ["desktop", "web", "android", "ios"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"

[dev-dependencies]
fission-test-driver = { path = "../../crates/tools/fission-test-driver" }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
