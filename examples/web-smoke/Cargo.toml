[package]
name = "web-smoke"
version = "0.11.1"
edition = "2021"

[lib]
name = "web_smoke"
crate-type = ["cdylib", "rlib"]

[features]
default = ["standalone-entry"]
standalone-entry = []

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[dependencies]
anyhow = "1.0"
fission = { path = "../../crates/authoring/fission", default-features = false, features = ["desktop", "web", "android", "ios"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
