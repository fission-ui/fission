[package]
name = "scene2d-qualification"
version = "0.1.0-alpha.1"
edition = "2021"
license = "Apache-2.0"
publish = false

[package.metadata.fission]
api-status = "alpha"

[lib]
name = "scene2d_qualification"
crate-type = ["cdylib", "rlib"]

[features]
default = ["standalone-entry"]
standalone-entry = []

[dependencies]
anyhow = "1.0"
console_error_panic_hook = "0.1"
fission = { path = "../../crates/authoring/fission", default-features = false, features = ["desktop", "web", "scene2d", "game", "physics-rapier2d"] }
serde = { version = "1.0", features = ["derive"] }
wasm-bindgen = "0.2"
