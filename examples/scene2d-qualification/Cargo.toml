[package]
name = "scene2d-qualification"
version = "0.1.0-alpha.1"
edition = "2021"
license = "Apache-2.0"
publish = false

[package.metadata.fission]
api-status = "alpha"

[lib]
name = "scene2d_qualification"
crate-type = ["cdylib", "rlib"]

[features]
default = ["standalone-entry"]
standalone-entry = []

[dependencies]
anyhow = "1.0"
console_error_panic_hook = "0.1"
fission = { path = "../../crates/authoring/fission", default-features = false, features = ["desktop", "web", "scene2d", "game", "physics-rapier2d"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
wasm-bindgen = "0.2"

[dev-dependencies]
fission-test-driver = { path = "../../crates/tools/fission-test-driver", version = "0.15.1" }
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
fission-assets = { path = "../../crates/core/fission-assets", version = "=0.1.0-alpha.1" }
