[package]
name = "widget-gallery"
version = "0.14.1"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "widget_gallery"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
lazy_static = "1.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fission = { path = "../../crates/authoring/fission", default-features = false, features = ["desktop"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
fission = { path = "../../crates/authoring/fission", default-features = false, features = ["web"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"

[dev-dependencies]
fission-test = { path = "../../crates/tools/fission-test" }
fission-test-driver = { path = "../../crates/tools/fission-test-driver" }
image = "0.25"
