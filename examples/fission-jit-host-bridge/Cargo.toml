[package]
name = "fission-jit-host-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "fission_jit_host_bridge"
crate-type = ["dylib"]

[dependencies]
chrono-api = { package = "chrono", version = "0.4" }
fission = { path = "../../crates/authoring/fission", default-features = false }
fission-devtools = { path = "../../crates/tools/fission-devtools" }
serde-api = { package = "serde", version = "1.0", features = ["derive"] }
