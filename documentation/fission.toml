targets = ["static-site"]

[app]
name = "fission-documentation"
app_id = "rs.fission.documentation"

[site]
entry = "crate::site_app"
base_url = "https://fission.rs"
base_path = "/"
canonical_url = "https://fission.rs"
out_dir = "dist/site"
default_locale = "en-GB"
locales = ["en-GB"]
pretty_urls = true
generate_sitemap = true
generate_robots = true
title = "Fission"
description = "Build, test, package, and release production Rust apps across macOS, Windows, Linux, Web, Android, iOS, Terminal, Static site, and SSR targets."
logo = "/img/fission-mark.svg"
favicon = "/img/fission-mark.svg"
asset_dirs = ["static"]
css_files = ["site/overrides.css", "site/value-redesign.css"]

[site.code_highlighting]
enabled = true

[site.search]
enabled = true

[[site.elements]]
placement = "head-end"
file = "site/google-analytics.html"

[[site.elements]]
placement = "body-end"
file = "site/crates-enhancement.html"
route_prefixes = ["/crates/", "/es/crates/"]

[[site.elements]]
placement = "body-end"
file = "site/value-enhancement.html"

[distribution.github_pages.production]
owner = "fission-ui"
repo = "fission"
mode = "actions"
source = "github-actions"
site_kind = "project"
base_path = "/"
custom_domain = "fission.rs"
enforce_https = true
workflow = "publish-website.yml"
production_branch = "main"

[[site.nav]]
title = "Docs"
href = "/docs/"

[[site.nav]]
title = "Reference"
href = "/reference/overview/overview/"

[[site.nav]]
title = "Crates"
href = "/crates/"

[[site.nav]]
title = "Blog"
href = "/blog/"

[[site.routes]]
kind = "content"
path = "/docs"
source = "content/docs"
template = "fission::site::documentation"
sidebar = "site/docs-sidebar.toml"

[[site.routes]]
kind = "content"
path = "/reference"
source = "content/reference"
template = "fission::site::documentation"
sidebar = "site/reference-sidebar.toml"

[[site.routes]]
kind = "content"
path = "/blog"
source = "content/blog"
template = "fission::site::blog"
sidebar = "site/blog-sidebar.toml"
