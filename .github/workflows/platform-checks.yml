name: Platform checks

on:
  pull_request:
  push:
    branches:
      - main
      - platforms
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    name: CLI platform script tests
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config

      - name: Check CLI dependency boundaries
        run: ./scripts/check_command_dependency_boundaries.sh

      - name: Check published dependency boundaries
        run: ./scripts/check_published_dependency_boundaries.sh

      - name: Test generated platform scripts
        run: cargo test -p cargo-fission

  web:
    name: Web / wasm
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Linux native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config

      - name: Check wasm core crates
        run: |
          cargo check -p fission-core --target wasm32-unknown-unknown
          cargo check -p fission-widgets --target wasm32-unknown-unknown
          cargo check -p fission-charts --target wasm32-unknown-unknown
          cargo check -p web-smoke --target wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Diagnose web toolchain
        run: cargo run -p cargo-fission --bin fission -- doctor web --project-dir examples/web-smoke

      - name: Build web-smoke wasm package
        env:
          FISSION_WEB_TEST_CONTROL: '1'
        run: ./examples/web-smoke/platforms/web/build-wasm.sh

      - name: Run Web Canvas text-input conformance in Chromium
        run: |
          python3 -m http.server 8126 --bind 127.0.0.1 --directory examples/web-smoke/platforms/web &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          FISSION_WEB_SMOKE_URL='http://127.0.0.1:8126/?fission_renderer=canvas2d-software' \
            cargo test --locked -p web-smoke --test text_input_browser -- --nocapture

      - name: Run Web SQLite multi-context conformance in Chromium
        run: |
          cd crates/core/fission-store-sqlite
          python3 -c 'from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          class Handler(SimpleHTTPRequestHandler):
              def end_headers(self):
                  self.send_header("Cross-Origin-Opener-Policy", "same-origin")
                  self.send_header("Cross-Origin-Embedder-Policy", "require-corp")
                  super().end_headers()
          ThreadingHTTPServer(("127.0.0.1", 8127), Handler).serve_forever()' &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          cd ../../..
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:8127/tests/web/index.html >/dev/null; then
              break
            fi
            sleep 0.1
          done
          curl --fail --silent http://127.0.0.1:8127/tests/web/index.html >/dev/null
          FISSION_SQLITE_WEB_TEST_URL='http://127.0.0.1:8127/tests/web/index.html' \
            cargo test --locked -p fission-store-sqlite --test web_multitab_browser -- --nocapture

  android:
    name: Android package smoke
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    env:
      ANDROID_MIN_API_LEVEL: '24'
      ANDROID_TARGET_API_LEVEL: '35'
      ANDROID_BUILD_TOOLS_VERSION: '35.0.0'
      ANDROID_NDK_VERSION: '26.3.11579264'
      GRADLE_VERSION: '9.5.0'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Linux native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config

      - name: Set up Gradle
        run: |
          curl -fsSLo "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle/gradle-${GRADLE_VERSION}/bin/gradle" --version

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_TARGET_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Diagnose Android toolchain
        run: cargo run -p cargo-fission --bin fission -- doctor android --project-dir examples/mobile-smoke --strict

      - name: Check mobile-smoke for Android
        run: |
          export ANDROID_NDK="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export ANDROID_TOOLCHAIN="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$ANDROID_TOOLCHAIN/aarch64-linux-android${ANDROID_MIN_API_LEVEL}-clang"
          export CXX_aarch64_linux_android="$ANDROID_TOOLCHAIN/aarch64-linux-android${ANDROID_MIN_API_LEVEL}-clang++"
          export AR_aarch64_linux_android="$ANDROID_TOOLCHAIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_AR="$AR_aarch64_linux_android"
          cargo check -p mobile-smoke --target aarch64-linux-android

      - name: Package mobile-smoke APK
        run: |
          export ANDROID_NDK="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          ./platforms/android/package-apk.sh
        working-directory: examples/mobile-smoke

  ios:
    name: iOS simulator and device compile
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.pull_request.author_association)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,aarch64-apple-ios

      - name: Diagnose iOS toolchain
        run: cargo run -p cargo-fission --bin fission -- doctor ios --project-dir examples/mobile-smoke --strict

      - name: Check mobile-smoke for iOS simulator
        run: cargo check -p mobile-smoke --target aarch64-apple-ios-sim

      - name: Check mobile-smoke for iOS device
        run: cargo check -p mobile-smoke --target aarch64-apple-ios

      - name: Package mobile-smoke simulator app
        run: ./platforms/ios/package-sim.sh
        working-directory: examples/mobile-smoke
