name: Publish website

on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches:
      - main
    paths:
      - 'documentation/**'
      - 'crates/**'
      - 'examples/chart-gallery/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/publish-website.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2

      - name: Install Linux native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Restore accumulated crate index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p documentation/data
          gh release download crate-index --pattern fission-crates.sqlite3 --dir documentation/data || true

      - name: Refresh Fission crate index
        run: cargo run -p fission-documentation --features crate-indexer --bin update-crate-index -- documentation/data/fission-crates.sqlite3

      - name: Verify static site dependency boundary
        run: |
          if cargo tree -p cargo-fission --target x86_64-unknown-linux-gnu -i libdbus-sys --locked | grep -q 'libdbus-sys'; then
            echo "Static site commands must not pull libdbus-sys through the Fission command dependency graph." >&2
            exit 1
          fi
          if cargo tree -p fission-command-site --locked | grep -E 'keyring|aws-sdk|dbus|secret-service'; then
            echo "fission-command-site must remain independent of credentials and provider SDKs." >&2
            exit 1
          fi

      - name: Check static site routes
        run: cargo run -p cargo-fission --bin fission -- site check --project-dir documentation --release

      - name: Package static site
        run: cargo run -p cargo-fission --bin fission -- package --project-dir documentation --target site --format static --release

      - name: Verify generated static site
        run: |
          test -f documentation/target/fission/release/static-site/static/index.html
          test -f documentation/target/fission/release/static-site/static/site.css
          test -f documentation/target/fission/release/static-site/static/sitemap.xml
          test -f documentation/target/fission/release/static-site/static/robots.txt
          test -f documentation/target/fission/release/static-site/static/search/search.js
          test -f documentation/target/fission/release/static-site/static/search/manifest.json
          test -f documentation/target/fission/release/static-site/static/search/docs.json
          test -f documentation/target/fission/release/static-site/static/img/fission-mark.svg
          test -f documentation/target/fission/release/static-site/static/img/charts/line-gradient-area.png
          test -f documentation/target/fission/release/static-site/static/artifact-manifest.json
          test -f documentation/target/fission/release/static-site/static/crates/index.html

      - name: Replace accumulated crate index asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view crate-index >/dev/null 2>&1 || gh release create crate-index --title "Fission crate index" --notes "Internal database used to generate fission.rs/crates."
          gh release upload crate-index documentation/data/fission-crates.sqlite3 --clobber

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: documentation/target/fission/release/static-site/static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
