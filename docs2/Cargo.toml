[package]
name = "fission-docs2"
version = "0.15.1"
edition = "2021"
license = "Apache-2.0"
default-run = "fission-docs2"

[dependencies]
anyhow = "1"
shell-words = "1.1"
fission = { path = "../crates/authoring/fission", default-features = false, features = ["site"] }
serde_json = "1"

[dev-dependencies]
fission-test-driver = { path = "../crates/tools/fission-test-driver" }

[build-dependencies]
fission-design-system-codegen = { path = "../crates/tools/fission-design-system-codegen" }
