targets = ["static-site"]

[app]
name = "fission-docs2"
app_id = "rs.fission.docs2"

[site]
entry = "crate::site_app"
base_url = "https://fission.rs"
base_path = "/"
canonical_url = "https://fission.rs"
out_dir = "dist/site"
default_locale = "en-GB"
locales = ["en-GB", "es-ES"]
pretty_urls = true
generate_sitemap = true
generate_robots = true
title = "Fission"
description = "Build native desktop, mobile and web applications in Rust from one shared product model."
logo = "/img/fission-mark.svg"
favicon = "/img/fission-mark.svg"
asset_dirs = ["site/assets", "generated-assets"]
css_files = ["site/docs2.css"]

[site.code_highlighting]
enabled = true

[site.search]
enabled = false

[[site.elements]]
placement = "head-end"
file = "site/google-analytics.html"

[distribution.github_pages.production]
owner = "fission-ui"
repo = "fission"
mode = "actions"
source = "github-actions"
site_kind = "project"
base_path = "/"
custom_domain = "fission.rs"
enforce_https = true
workflow = "publish-website.yml"
production_branch = "main"
